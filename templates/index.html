<!doctype html>
<html>
  <head>
    <title>Malaria Detection System</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        width: 420px;
        text-align: center;
        box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
      }

      h1 {
        margin-bottom: 10px;
      }

      p {
        color: gray;
        font-size: 14px;
      }

      input[type="file"] {
        margin-top: 20px;
      }

      button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      img {
        margin-top: 20px;
        width: 200px;
        border-radius: 8px;
        display: none;
      }
    </style>

    <script>
      function previewImage(event) {
        const image = document.getElementById("preview");

        image.src = URL.createObjectURL(event.target.files[0]);

        image.style.display = "block";
      }
    </script>
  </head>

  <body>
    <div class="container">
      <h1>Malaria Detection</h1>

      <p>Upload a blood smear microscopy image to detect malaria infection.</p>

      <form action="/predict" method="post" enctype="multipart/form-data">
        <input
          type="file"
          name="file"
          accept="image/*"
          onchange="previewImage(event)"
          required
        />

        <br />

        <img id="preview" />

        <br />

        <button type="submit">Detect Malaria</button>
      </form>
    </div>
  </body>
</html>
