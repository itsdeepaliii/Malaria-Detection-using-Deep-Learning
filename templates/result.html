<!doctype html>
<html>
  <head>
    <title>Malaria Detection Result</title>

    <style>
      body {
        font-family: Arial;
        background: #f4f6f8;
        text-align: center;
      }

      .container {
        margin-top: 50px;
      }

      .card {
        background: white;
        width: 400px;
        margin: auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }

      img {
        margin-top: 15px;
        border-radius: 8px;
      }

      .result {
        font-size: 22px;
        margin-top: 15px;
      }

      .confidence {
        color: gray;
        font-size: 18px;
      }

      button {
        margin-top: 20px;
        padding: 10px 20px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h2>Malaria Detection Result</h2>

        <img src="{{image}}" width="250" />

        <div class="result">Prediction: <b>{{prediction}}</b></div>

        <div class="confidence">Confidence: {{confidence}} %</div>

        <a href="/">
          <button>Upload Another Image</button>
        </a>
      </div>
    </div>
  </body>
</html>
